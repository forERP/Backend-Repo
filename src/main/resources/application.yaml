spring:
  application:
    name: erp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8081

app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED}
      login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID}
      employee-code: ${BOOTSTRAP_ADMIN_EMPLOYEE_CODE}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}
      name: ${BOOTSTRAP_ADMIN_NAME}
      role: ${BOOTSTRAP_ADMIN_ROLE}
      store-code: ${BOOTSTRAP_ADMIN_STORE_CODE}
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  bootstrap:
    admin:
      enabled: false

jwt:
  secret:
    key: ${JWT_SECRET_KEY}