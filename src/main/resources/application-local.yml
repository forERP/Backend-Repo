spring:
  datasource:
    url: jdbc:mysql://localhost:3307/forerp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: mysql

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:admin}
      employee-code: ${BOOTSTRAP_ADMIN_EMPLOYEE_CODE:0000}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin}
      name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
      phone-number: ${BOOTSTRAP_ADMIN_PHONE_NUMBER:010-0000-0000}
      role: ${BOOTSTRAP_ADMIN_ROLE:HQ_ADMIN}
      store-code: ${BOOTSTRAP_ADMIN_STORE_CODE:000}

jwt:
  secret:
    key: ${JWT_SECRET_KEY:dev-super-secret-change-me-please}
