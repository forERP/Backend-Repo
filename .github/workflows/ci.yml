name: Backend CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw -Dspring.profiles.active=test test

  docker-image:
    # develop 브랜치에 push 될 때만 이미지 빌드/푸시
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image tag
        id: prep
        run: echo "image_tag=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):dev" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show surefire reports on failure
        if: failure()
        run: |
          echo "=== surefire-reports ==="
          ls -R target/surefire-reports || true
          echo "=== *.txt ==="
          for f in target/surefire-reports/*.txt; do echo "--- $f ---"; cat "$f"; done || true